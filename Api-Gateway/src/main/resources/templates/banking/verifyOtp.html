<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Transaction OTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0eaff, #f5f7fb);
            font-family: Arial, sans-serif;
        }

        .otp-card {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        .otp-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .otp-input {
            letter-spacing: 10px;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
        }

        .timer {
            font-size: 25px;
            font-weight: bold;
            color: #2563eb;
        }

        .timer.expired {
            color: #dc3545;
        }
    </style>
</head>

<body>
<div class="container px-3">
    <div class="otp-card mx-auto text-center">

        <div class="otp-icon">🔐</div>

        <h3 class="fw-bold mb-2">Verify Your Transaction</h3>

        <p class="text-secondary mb-4">
            Enter the 6-digit OTP sent to your registered contact
            to authorize this transaction.
        </p>

        <div class="mb-4">
            <div class="text-secondary small mb-1">OTP expires in</div>
            <div id="timer" class="timer">05:00</div>
        </div>

        <div id="expiredMessage"
             class="alert alert-danger py-2 d-none">
            The countdown has ended. Request a new OTP to continue.
        </div>

        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>

        <!-- Submit OTP -->
        <form id="otpForm"
              th:action="@{/account/verify-otp}"
              method="post">

            <input type="hidden"
                   name="transactionId"
                   th:value="${transactionId}">

            <div class="mb-3 text-start">
                <label for="otp" class="form-label fw-semibold">
                    Enter OTP
                </label>

                <input type="text"
                       id="otp"
                       name="otp"
                       class="form-control form-control-lg otp-input"
                       placeholder="------"
                       inputmode="numeric"
                       pattern="[0-9]{6}"
                       maxlength="6"
                       autocomplete="one-time-code"
                       required>
            </div>

            <button type="submit"
                    id="verifyButton"
                    class="btn btn-primary btn-lg w-100">
                Verify OTP &amp; Transfer
            </button>
        </form>

        <!-- Resend OTP -->
        <form th:action="@{/account/resend-otp}"
              method="post"
              class="mt-3">

            <input type="hidden"
                   name="transactionId"
                   th:value="${transactionId}">

            <button type="submit"
                    id="resendButton"
                    class="btn btn-outline-primary w-100">
                Resend OTP
            </button>
        </form>

        <a th:href="@{/account/transfer}"
           class="btn btn-link text-secondary mt-3">
            Return to transfer
        </a>

        <p class="text-muted small mt-3 mb-0">
            Never share your OTP with anyone.
        </p>
    </div>
</div>

<script>
    const timerElement = document.getElementById("timer");
    const otpInput = document.getElementById("otp");
    const verifyButton = document.getElementById("verifyButton");
    const resendButton = document.getElementById("resendButton");
    const expiredMessage = document.getElementById("expiredMessage");
    const otpForm = document.getElementById("otpForm");

    let remainingSeconds = 5 * 60;
    let timerInterval;

    function updateTimer() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;

        timerElement.textContent =
            String(minutes).padStart(2, "0") + ":" +
            String(seconds).padStart(2, "0");

        if (remainingSeconds <= 0) {
            clearInterval(timerInterval);

            timerElement.textContent = "00:00";
            timerElement.classList.add("expired");
            expiredMessage.classList.remove("d-none");

            otpInput.disabled = true;
            verifyButton.disabled = true;
            resendButton.disabled = false;
            return;
        }

        remainingSeconds--;
    }

    otpInput.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 6);
    });

    otpForm.addEventListener("submit", function (event) {
        if (remainingSeconds <= 0) {
            event.preventDefault();
            expiredMessage.classList.remove("d-none");
        }
    });

    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
</script>
</body>
</html>
