<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Balance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0">Check Account Balance</h4>
                </div>

                <div class="card-body p-4">

                    <!-- Account Number Form -->
                    <form th:action="@{/account/check-balance}" method="get">
                        <label for="accountNumber">Account Number</label>

                        <input type="text"
                               id="accountNumber"
                               name="accountNumber"
                               th:value="${accountNumber}"
                               placeholder="Enter account number"
                               required>

                        <button type="submit">Check Balance</button>
                    </form>

                    <div th:if="${balance != null}" class="alert alert-success mt-3">
                        <h5>Available Balance</h5>
                        <h3>₹ <span th:text="${balance}"></span></h3>
                    </div>
                    <!-- Error Message -->
                    <div th:if="${error != null}"
                         class="alert alert-danger mt-3"
                         th:text="${error}">
                    </div>

                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/api/user/v1/home}" class="text-decoration-none">
                    Back to Home
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
