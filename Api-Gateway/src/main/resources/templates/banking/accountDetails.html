<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4>Find Account Details</h4>
                </div>

                <div class="card-body">

                    <!-- Search Form -->
                    <form th:action="@{/account/get/details}" method="get">

                        <div class="mb-3">
                            <label for="accountNumber" class="form-label">
                                Account Number
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="accountNumber"
                                   name="accountNumber"
                                   th:value="${param.accountNumber}"
                                   placeholder="Enter account number"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Search Account
                        </button>

                    </form>

                    <!-- Account Details -->
                    <div th:if="${account != null}" class="mt-4">

                        <hr>
                        <h5 class="text-primary mb-3">Account Information</h5>

                        <p><strong>Account Number:</strong>
                            <span th:text="${account.accountNumber}"></span>
                        </p>

                        <p><strong>Account Holder:</strong>
                            <span th:text="${account.accountHolderName}"></span>
                        </p>

                        <p><strong>Email:</strong>
                            <span th:text="${account.email}"></span>
                        </p>

                        <p><strong>Phone:</strong>
                            <span th:text="${account.phone}"></span>
                        </p>

                        <p><strong>Account Type:</strong>
                            <span th:text="${account.accountType}"></span>
                        </p>

                        <p><strong>Balance:</strong>
                            <span th:text="${account.balance}"></span>
                        </p>

                        <p><strong>Status:</strong>
                            <span th:text="${account.status}"></span>
                        </p>

                        <div class="text-center mt-3">
                            <a th:href="@{/api/user/v1/home}" class="text-decoration-none">
                                Back to Home
                            </a>
                        </div>

                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
```
