<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyBank | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .bank-logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #0f766e;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #0f766e;
            box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #0f766e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #115e59;
        }

        .register-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .register-link a {
            color: #0f766e;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #dc2626;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        .success-message {
            color: #15803d;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="bank-logo">MyBank</div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">Login to access your banking account</p>

    <!-- Error Message -->
    <p class="error-message"
       th:if="${param.error}">
        Invalid username or password.
    </p>

    <!-- Logout Message -->
    <p class="success-message"
       th:if="${param.logout}">
        You have been logged out successfully.
    </p>

    <!-- Login Form -->
    <form th:action="@{/api/user/v1/login-info}" th:object="${login}" method="post">

        <!-- Username -->
        <div class="form-group">
            <label for="username">Username</label>

            <input type="text"
                   id="username"
                   th:field="*{username}"
                   placeholder="Enter your username"
                   autocomplete="username"
                   required>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>

            <input type="password"
                   id="password"
                   th:field="*{password}"
                   placeholder="Enter your password"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="login-btn">
            Login to MyBank
        </button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a th:href="@{api/user/v1}">Create Account</a>
    </div>

</div>

</body>
</html>
